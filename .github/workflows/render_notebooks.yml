name: Render Notebooks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Install a dark theme
        run: |
          # The custom dark CSS will need to be downloaded or created once
          # A simple CSS file can work, or a more complex one
          mkdir -p ./.github/styles/
          echo '
          body {
            background-color: #121212;
            color: #e0e0e0;
          }
          .jp-InputArea-editor, .jp-OutputArea-output, .CodeMirror-scroll {
            background-color: #1e1e1e !important;
            color: #e0e0e0;
          }
          .jp-MarkdownOutput, .rendered_html {
            color: #e0e0e0;
          }
          .jp-RenderedImage {
              filter: invert(0.95);
          }
          ' > ./.github/styles/dark.css

      - name: Convert notebooks to styled HTML
        run: |
          mkdir -p rendered_notebooks
          for notebook in *.ipynb; do
            if [ -f "$notebook" ]; then
              nbconvert "$notebook" --to html --template basic --CSSFile=./.github/styles/dark.css --output-dir="rendered_notebooks/"
            fi
          done

      - name: Upload rendered notebooks as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-html-notebooks
          path: rendered_notebooks/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rendered_notebooks
          destination_dir: ./
